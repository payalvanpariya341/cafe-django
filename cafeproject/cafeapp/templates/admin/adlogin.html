{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>
{% if messages %}
    {% for message in messages %}
        <script>
            alert('{{ message }}');
        </script>
    {% endfor %}
{% endif %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>Admin Login</h2>

            <p>Welcome Admin</p>

            <form method="POST">

                {% csrf_token %}

                <div class="input-box">
                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required>
                </div>

                <div class="input-box">
                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required>
                </div>

                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

        </div>

    </div>

</body>
</html>
