{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>

    <link rel="stylesheet" href="{% static 'css/adstyle.css' %}">
</head>
<body>

{% include 'admin/adheader.html' %}

<section class="add-menu">

    <div class="menu-form">

        <h2>Edit User</h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <table>

                <tr>
                    <td>Full Name</td>
                    <td>
                        <input type="text" name="name" placeholder="Enter Full Name" required value="{{ data.name }}">
                    </td>
                </tr>

                <tr>
                    <td>Email</td>
                    <td>
                        <input type="email" name="email" placeholder="Enter Email" required value="{{ data.email }}">
                    </td>
                </tr>

                <tr>
                    <td>Mobile</td>
                    <td>
                        <input type="tel" name="mb" placeholder="Enter Mobile Number" required value="{{ data.mobile }}">
                    </td>
                </tr>

                <tr>
                    <td>Password</td>
                    <td>
                        <input type="text" name="password" placeholder="Enter Username" required value="{{ data.password }}">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <button type="submit" href="#manageuser">Edit User</button>
                        <a class="cancel-btn" href="{% url 'manageuser' %}">Cancel</a>
                    </td>
                </tr>
            </table>

        </form>

    </div>

</section>

</body>
</html>
